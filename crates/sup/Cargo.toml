[package]
name = "rrc-sup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rrc-cfg = { path = "../cfg" }
rrc-core = { path = "../core" }
rustix = { version = "1", features = ["process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
